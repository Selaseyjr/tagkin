name: Keep hosted database awake

# Supabase's free plan pauses a project after a week without activity. A tiny read query twice a
# week keeps the demo reachable for recruiters and testers. Remove when moving to a paid plan.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Read one row through the IPv4 pooler
        run: |
          pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$pw"
          psql "postgresql://postgres.czcquowolvtcdifcnijo:${pw}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres" \
            -Atc "select 'awake: ' || count(*) from public.prices"
