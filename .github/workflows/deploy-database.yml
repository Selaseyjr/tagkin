name: Database deploy

# Pull requests and manual runs: dry run against the hosted project (no changes).
# Main: applies migrations only after CI has passed on that exact commit (ADR 0014).
# Every run: checks the hosted sign-in settings match the repo (read-only).
on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/deploy-database.yml"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: database-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: czcquowolvtcdifcnijo
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  APPLY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'workflow_run' && 'Deploy to hosted database' || 'Hosted database dry run' }}
    # On main, run only when CI succeeded; never deploy a commit that failed its checks.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On main, deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Connection through the IPv4 session pooler (direct connections are IPv6-only)
        run: |
          pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          url="postgresql://postgres.${PROJECT_REF}:${pw}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$pw"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Migrations (dry run)
        if: env.APPLY != 'true'
        run: supabase db push --remote="$DB_URL" --dry-run
      - name: Apply migrations
        if: env.APPLY == 'true'
        run: supabase db push --remote="$DB_URL" --yes
      - name: Hosted sign-in settings match the repo (read-only)
        run: ./supabase/check-remote-auth.sh
