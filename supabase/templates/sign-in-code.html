<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f6f8f7;
      font-family: -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;
      color: #0b1712;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 440px; background: #ffffff; border-radius: 22px; padding: 32px"
          >
            <tr>
              <td style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">tagkin</td>
            </tr>
            <tr>
              <td style="padding-top: 24px; font-size: 16px; line-height: 1.5">
                Your sign-in code:
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 12px 0 8px;
                  font-size: 34px;
                  font-weight: 700;
                  letter-spacing: 0.25em;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; line-height: 1.5; color: #4f5e57">
                It works for 10 minutes. Type it in the app or on tagkin.app.<br />
                Didn't ask for it? You can ignore this email. Nobody can sign in without the code.
              </td>
            </tr>
            <tr>
              <td style="padding-top: 24px; font-size: 12px; color: #4f5e57">
                Tagkin will never ask you for this code in a message or by phone.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
