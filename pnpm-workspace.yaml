packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@expo/cli@58.1.20"
  - "@expo/env@2.6.0"
  - "@expo/fingerprint@0.21.10"
  - "@expo/metro-config@58.0.22"
  - "@expo/router-server@58.0.22"
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo@58.0.24
  - prettier@3.10.1
  - turbo@2.11.11
